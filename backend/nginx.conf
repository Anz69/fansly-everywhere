server {
    listen 80 default_server;
    server_name fanslysite.com www.fanslysite.com _;

    root /var/www/fansly-everywhere/artifacts/fansly-everywhere/dist/public;
    index index.html;

    add_header X-Content-Type-Options    "nosniff"         always;
    add_header X-Frame-Options           "SAMEORIGIN"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    client_max_body_size 150m;

    location ^~ /uploads/ {
        root /var/www/fansly-everywhere;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /api/auth/tg { return 308 /api/auth/tg/; }
    location = /api/auth/bot { return 308 /api/auth/bot/; }

    location /api/auth/tg/ {
        proxy_pass         http://127.0.0.1:3003/mtproto/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
        proxy_read_timeout 120s;
        client_max_body_size 64k;
    }

    location /api/auth/bot/ {
        proxy_pass         http://127.0.0.1:3002/bot/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_pass_header  Set-Cookie;
        client_max_body_size 4k;
    }

    location ^~ /api/admin/upload {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
        proxy_read_timeout 120s;
        client_max_body_size 150m;
    }

    location /api {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location = /tg-bot-auth.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — не проходит повторный location matching
    location @spa {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        rewrite ^ /index.html break;
    }

    # Панель администратора — доступна
    location ^~ /admin {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri @spa;
    }

    # Все страницы моделей — доступны (/model/любой-слаг)
    location ^~ /model/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri @spa;
    }

    # Главная и всё остальное — редирект на stella-cardo
    location / {
        return 301 /model/stella-cardo;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;
}
